version: "3.9"

services:
  auth-service:
    build:
      context: ./services/auth-service
    container_name: auth-service
    ports:
      - "8000:8000"
    depends_on:
      - auth-db
    env_file:
      - ./services/auth-service/.env
    networks:
      - mentalnet

  auth-db:
    image: postgres:14
    container_name: auth-db
    ports:
      - "5436:5432"
    volumes:
      - auth-db-data:/var/lib/postgresql/data
    
    environment:
      - POSTGRES_DB=authdb
      - POSTGRES_USER=authuser
      - POSTGRES_PASSWORD=authpass
    networks:
      - mentalnet

  chatbot-service:
